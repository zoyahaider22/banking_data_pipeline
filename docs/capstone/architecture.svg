<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="1100" height="540" fill="#ffffff"/>
<text x="550" y="28" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">Week 8 integrated banking capstone - data flow</text>
<rect x="20" y="45" width="1060" height="68" rx="8" fill="#fafafa" stroke="#444" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="550" y="69" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">ORCHESTRATOR: plain Python runner (src\capstone\pipeline.py, run_pipeline)</text>
<text x="550" y="87" font-size="12" text-anchor="middle" fill="#222">discover -&gt; ingest -&gt; validate -&gt; transform -&gt; publish</text>
<text x="550" y="105" font-size="12" text-anchor="middle" fill="#222">An error stops the run before the later steps; the run is recorded as FAILED with the failing step.</text>
<rect x="440" y="130" width="190" height="70" rx="8" fill="#e3efe3" stroke="#444" stroke-width="1.5"/>
<text x="535" y="154" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">ACCOUNTS REFERENCE</text>
<text x="535" y="172" font-size="12" text-anchor="middle" fill="#222">data\reference\accounts.csv</text>
<text x="535" y="190" font-size="12" text-anchor="middle" fill="#222">used by validate</text>
<rect x="20" y="215" width="190" height="110" rx="8" fill="#eeeeee" stroke="#444" stroke-width="1.5"/>
<text x="115" y="239" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">LANDING</text>
<text x="115" y="257" font-size="12" text-anchor="middle" fill="#222">data\capstone\landing</text>
<text x="115" y="275" font-size="12" text-anchor="middle" fill="#222">original + synthetic CSV files</text>
<text x="115" y="293" font-size="12" text-anchor="middle" fill="#222">named BR00X_YYYYMMDD_</text>
<text x="115" y="311" font-size="12" text-anchor="middle" fill="#222">TRANSACTION.csv</text>
<rect x="300" y="215" width="190" height="110" rx="8" fill="#f3e0c8" stroke="#444" stroke-width="1.5"/>
<text x="395" y="239" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">BRONZE</text>
<text x="395" y="257" font-size="12" text-anchor="middle" fill="#222">bronze_transactions</text>
<text x="395" y="275" font-size="12" text-anchor="middle" fill="#222">source rows as received</text>
<text x="395" y="293" font-size="12" text-anchor="middle" fill="#222">+ filename, branch ID,</text>
<text x="395" y="311" font-size="12" text-anchor="middle" fill="#222">run ID, source row number</text>
<rect x="580" y="215" width="190" height="110" rx="8" fill="#dde3ec" stroke="#444" stroke-width="1.5"/>
<text x="675" y="239" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">SILVER</text>
<text x="675" y="257" font-size="12" text-anchor="middle" fill="#222">silver_transactions</text>
<text x="675" y="275" font-size="12" text-anchor="middle" fill="#222">accepted rows only</text>
<text x="675" y="293" font-size="12" text-anchor="middle" fill="#222">primary key:</text>
<text x="675" y="311" font-size="12" text-anchor="middle" fill="#222">transaction_id</text>
<rect x="860" y="215" width="190" height="110" rx="8" fill="#fbeaa6" stroke="#444" stroke-width="1.5"/>
<text x="955" y="239" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">GOLD</text>
<text x="955" y="257" font-size="12" text-anchor="middle" fill="#222">gold_branch_daily_summary</text>
<text x="955" y="275" font-size="12" text-anchor="middle" fill="#222">+ gold CSV file</text>
<text x="955" y="293" font-size="12" text-anchor="middle" fill="#222">built from Silver only</text>
<text x="955" y="311" font-size="12" text-anchor="middle" fill="#222">replaced on each publish</text>
<path d="M210,270 L300,270" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M490,270 L580,270" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M770,270 L860,270" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="255" y="290" font-size="12" text-anchor="middle" fill="#222">ingest</text>
<text x="535" y="290" font-size="12" text-anchor="middle" fill="#222">validate</text>
<text x="815" y="290" font-size="12" text-anchor="middle" fill="#222">transform</text>
<text x="815" y="306" font-size="12" text-anchor="middle" fill="#222">+ publish</text>
<path d="M535,200 L535,262" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580" y="375" width="190" height="90" rx="8" fill="#f6c9c9" stroke="#444" stroke-width="1.5"/>
<text x="675" y="399" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">EXCEPTIONS</text>
<text x="675" y="417" font-size="12" text-anchor="middle" fill="#222">exceptions table</text>
<text x="675" y="435" font-size="12" text-anchor="middle" fill="#222">rejected rows + all reasons</text>
<text x="675" y="453" font-size="12" text-anchor="middle" fill="#222">+ source file and row no.</text>
<path d="M395,325 L395,420 L580,420" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="405" y="412" font-size="11" text-anchor="start" fill="#222">validate: rejected rows</text>
<rect x="860" y="375" width="190" height="90" rx="8" fill="#e8e0f0" stroke="#444" stroke-width="1.5"/>
<text x="955" y="399" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">AUDIT TABLES</text>
<text x="955" y="417" font-size="12" text-anchor="middle" fill="#222">run_audit: status + reason</text>
<text x="955" y="435" font-size="12" text-anchor="middle" fill="#222">file_audit: row counts,</text>
<text x="955" y="453" font-size="12" text-anchor="middle" fill="#222">SHA-256, file status</text>
<text x="955" y="485" font-size="11" text-anchor="middle" fill="#222">written by every run</text>
<text x="20" y="505" font-size="12" text-anchor="start" fill="#222">Rows rejected by validate never reach Silver or Gold. Publish replaces the Gold table and CSV only after validate and transform succeed.</text>
<text x="20" y="524" font-size="12" text-anchor="start" fill="#222">transform builds Gold twice (PySpark and SQL) and compares them; unrecognized files in Landing are listed and not loaded.</text>
</svg>